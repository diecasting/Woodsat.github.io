# ==========================================================================
# contact.toml — Contact Details (EDIT THIS TO BRAND YOUR SITE)
# ==========================================================================
# SINGLE SOURCE OF TRUTH for contact details. Merged into
# config/_default/params.toml by scripts/sync-branding.py.
# Templates read these values as .Site.Params.contact.*
# ==========================================================================

[params]
[params.contact]
  email = "jason@woodsat.com"
  phone = ""
  address = ""

  # RFQ form endpoint (Formspree compatible). Create your form at
  # https://formspree.io and replace REPLACE_WITH_FORM_ID with your real
  # Formspree form ID. Submissions are emailed to jason@woodsat.com.
  # If left empty, the template shows a graceful email CTA instead.
  form_action = "https://formspree.io/f/xdaqjegz"
