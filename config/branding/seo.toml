# ==========================================================================
# seo.toml — Site-wide SEO Defaults (EDIT THIS TO BRAND YOUR SITE)
# ==========================================================================
# SINGLE SOURCE OF TRUTH for site-wide SEO defaults. Merged into
# config/_default/params.toml by scripts/sync-branding.py.
# Templates read these values as .Site.Params.seo.*
# Per-page front matter `description` / `seo` overrides these.
# ==========================================================================

[params]
[params.seo]
  description = "Woodsat is a custom wooden speaker cabinet manufacturer providing OEM and ODM acoustic enclosure solutions, CNC wood routing, veneering and finishing for audio brands worldwide."
  keywords = ["wooden speaker cabinet", "OEM speaker enclosure", "ODM speaker cabinet", "wood CNC machining", "acoustic enclosure", "speaker box manufacturer"]
