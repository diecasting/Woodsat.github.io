# --- Product category catalog (language-neutral) ---

[[products]]
id = "precision-castings"
category = "Precision Castings"
material_family = "Engineering Alloys"
material_grades = ["Alloy A", "Alloy B", "Alloy C"]
alloy_designations = ["A", "B", "C"]
sort_order = 1
url_path = "/services/precision-casting/"

[[products]]
id = "machined-parts"
category = "Machined Parts"
material_family = "Engineering Alloys"
material_grades = ["Alloy A", "Alloy B"]
alloy_designations = ["A", "B"]
sort_order = 2
url_path = "/services/cnc-machining/"

# --- Localized product descriptions ---

[en.precision-castings]
name = "Precision Castings"
description = "Custom precision cast components in a range of engineering alloys for demanding industrial applications."
key_properties = "Dimensional accuracy, excellent surface finish, complex geometry capability"

[en.machined-parts]
name = "Machined Parts"
description = "Precision machined components with tight tolerances for functional and mating surfaces."
key_properties = "Tight tolerances, excellent surface finish, complex geometry capability"

