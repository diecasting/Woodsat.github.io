# --- Service catalog (language-neutral IDs) ---

[[services]]
id = "precision-casting"
schema_type = "Service"
url_path = "/services/precision-casting/"
sort_order = 1

[[services]]
id = "cnc-machining"
schema_type = "Service"
url_path = "/services/cnc-machining/"
sort_order = 2

[[services]]
id = "sheet-metal-fabrication"
schema_type = "Service"
url_path = "/services/sheet-metal-fabrication/"
sort_order = 3

[[services]]
id = "surface-treatment"
schema_type = "Service"
url_path = "/services/surface-treatment/"
sort_order = 4

[[services]]
id = "assembly-services"
schema_type = "Service"
url_path = "/services/assembly-services/"
sort_order = 5

# --- Localized service names and descriptions ---

[en.precision-casting]
name = "Precision Casting"
description = "Investment and sand casting of complex, near-net-shape metal components with tight tolerances and excellent surface finish."

[en.cnc-machining]
name = "CNC Machining"
description = "Multi-axis CNC milling and turning that brings cast and forged components to tight, repeatable tolerances."

[en.sheet-metal-fabrication]
name = "Sheet Metal Fabrication"
description = "Laser cutting, bending and welding of sheet metal enclosures, brackets and structural parts."

[en.surface-treatment]
name = "Surface Treatment & Finishing"
description = "Passivation, anodizing, powder coating and plating to protect parts and meet appearance specifications."

[en.assembly-services]
name = "Assembly & Value-Added Services"
description = "Sub-assembly, kitting, testing and packaging that deliver finished, inspection-ready modules."

[de.precision-casting]
name = "Präzisionsguss"
description = "Investment- und Sandguss komplexer, nahezu endkonturnaher Metallbauteile mit engen Toleranzen und erstklassiger Oberfläche."

[de.cnc-machining]
name = "CNC-Bearbeitung"
description = "Mehrachsige CNC-Fräs- und Drehbearbeitung, die Guss- und Schmiedeteile auf engste, wiederholbare Toleranzen bringt."

[de.sheet-metal-fabrication]
name = "Blechbearbeitung"
description = "Laserschneiden, Biegen und Schweißen von Blechgehäusen, Halterungen und Strukturteilen."

[de.surface-treatment]
name = "Oberflächenbehandlung"
description = "Passivieren, Eloxieren, Pulverbeschichten und Galvanisieren zum Korrosionsschutz und für Optik."

[de.assembly-services]
name = "Montage & Weiterverarbeitung"
description = "Unterbaugruppen, Kitting, Prüfung und Verpackung fertiger, prüffähiger Module."

[ja.precision-casting]
name = "精密鋳造"
description = "複雑なニアネットシェイプ金属部品のロストワックスおよび砂型鋳造。高精度かつ優れた表面品質。"

[ja.cnc-machining]
name = "CNC加工"
description = "多軸CNCフライス・旋盤加工により、鋳造・鍛造部品を高精度で仕上げ。"

[ja.sheet-metal-fabrication]
name = "板金加工"
description = "板金筐体・ブラケット・構造部品のレーザー切断・曲げ・溶接。"

[ja.surface-treatment]
name = "表面処理・仕上げ"
description = "耐食性と外観要件を満たすパッシベーション・陽極酸化・粉体塗装・めっき。"

[ja.assembly-services]
name = "組立・付加価値サービス"
description = "検査完了品のサブアセンブリ・キッティング・試験・包装。"

[fr.precision-casting]
name = "Moulage de précision"
description = "Fonderie de précision (cire perdue et sable) de pièces métalliques complexes quasi finies avec des tolérances serrées."

[fr.cnc-machining]
name = "Usinage CNC"
description = "Usinage CNC multi-axes (fraisage et tournage) pour des tolérances serrées et répétables."

[fr.sheet-metal-fabrication]
