[en.custom-wooden-speaker-cabinet-manufacturer]
name = "Custom Wooden Speaker Cabinet Manufacturer"
description = "Woodsat designs and builds custom wooden speaker cabinets and acoustic enclosures for audio brands, from prototype development to high-volume OEM and ODM production."

[de.custom-wooden-speaker-cabinet-manufacturer]
name = "Maßgefertigte Holz-Lautsprechergehäuse"
description = "Woodsat entwickelt und fertigt maßgeschneiderte Holz-Lautsprechergehäuse und Akustikgehäuse für Audiomarken – von der Prototypenentwicklung bis zur OEM/ODM-Serienfertigung."

[ja.custom-wooden-speaker-cabinet-manufacturer]
name = "カスタム木製スピーカーキャビネット製造"
description = "Woodsatはオーディオブランド向けに木製スピーカーキャビネットとアコースティックエンクロージャを設計・製造します。試作から大量OEM/ODM生産まで対応。"

[fr.custom-wooden-speaker-cabinet-manufacturer]
name = "Fabricant de coffrets acoustiques en bois sur mesure"
description = "Woodsat conçoit et fabrique des coffrets acoustiques en bois sur mesure pour les marques audio, du prototype à la production OEM et ODM en grand volume."

[es.custom-wooden-speaker-cabinet-manufacturer]
name = "Fabricante de cajas acústicas de madera a medida"
description = "Woodsat diseña y fabrica cajas acústicas de madera a medida para marcas de audio, desde el prototipo hasta la producción OEM y ODM en gran volumen."

