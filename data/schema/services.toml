# ==========================================================================
# services.toml — Service Catalog [SITE LAYER] (TEMPLATE EXAMPLE)
# ==========================================================================
# >>> EDIT / EXTEND with your services. <<<
# url_path must match the content directory path so the schema engine
# (layouts/partials/schema/render.html) emits Service JSON-LD automatically.
# Add one [[services]] block + a [<lang>.<id>] map per language you support.
# ==========================================================================

# --- Service catalog (language-neutral IDs) ---

[[services]]
id = "example-service"
schema_type = "Service"
url_path = "/services/example-service/"
sort_order = 1

[[services]]
id = "example-material"
schema_type = "Service"
url_path = "/materials/example-material/"
sort_order = 2

[[services]]
id = "example-industry"
schema_type = "Service"
url_path = "/industries/example-industry/"
sort_order = 3

# --- Localized service names and descriptions ---

[en.example-service]
name = "Precision Casting Service"
description = "Custom precision casting service producing complex, near-net-shape components with tight tolerances and excellent surface finish."

[en.example-material]
name = "Engineering Material Castings"
description = "Cast components in a range of engineering materials, selected to match strength, corrosion and temperature requirements."

[en.example-industry]
name = "Industrial Components"
description = "Manufactured components for demanding industrial applications, supplied with full quality documentation."

[de.example-service]
